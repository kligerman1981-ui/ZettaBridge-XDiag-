name: Build X-DIAG Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xdiag-android.yml'
      - 'tools/**'
      - 'CMakeLists.txt'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Obtain upstream ZettaBridge sources without republishing them
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/ZailoxTT/ZettaBridge.git /tmp/zetta-upstream
          # Retain project-specific build files from this repository.
          rsync -a --ignore-existing --exclude='.git' /tmp/zetta-upstream/ ./
          if [[ ! -f third_party/dynarmic/CMakeLists.txt ]]; then
            git clone --recursive --depth=1 https://github.com/Vita3K/dynarmic.git third_party/dynarmic
          fi
          test -f CMakeLists.txt
          test -f third_party/dynarmic/CMakeLists.txt
          test -f tools/build_xdiag_android.sh
          test -f tools/extract_sysroot.sh
          test -d android/launcher
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 -o /tmp/android-cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake e2fsprogs unzip curl python3 libboost-dev
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;30.0.16248370'
      - name: Stage portable Boost headers for Android NDK
        run: |
          test -f /usr/include/boost/icl/interval_map.hpp
          mkdir -p /tmp/boost-android
          cp -a /usr/include/boost /tmp/boost-android/
          test -f /tmp/boost-android/boost/icl/interval_map.hpp
      - name: Prepare 32-bit Android guest sysroot
        run: bash tools/extract_sysroot.sh
      - name: Fix Android bionic random initialization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("core/src/initial_stack.cpp")
          s = p.read_text()
          old = '#include <sys/random.h>'
          assert old in s
          s = s.replace(old, '#include <cstdio>')
          old = '''    if (getrandom(random_bytes, sizeof random_bytes, 0) != sizeof random_bytes) {
        for (std::size_t i = 0; i < sizeof random_bytes; ++i) random_bytes[i] = static_cast<std::uint8_t>(i * 37 + 11);
    }'''
          new = '''    std::FILE* random_source = std::fopen("/dev/urandom", "rb");
    if (!random_source) return 0;
    const std::size_t random_count = std::fread(random_bytes, 1, sizeof random_bytes, random_source);
    std::fclose(random_source);
    if (random_count != sizeof random_bytes) return 0;'''
          assert old in s, "upstream random initialization changed"
          p.write_text(s.replace(old, new))
          PY
      - name: Build native translator and launcher
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/30.0.16248370"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          bash tools/build_xdiag_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: XDiagCompat-android16-debug-apk
          path: android/launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
